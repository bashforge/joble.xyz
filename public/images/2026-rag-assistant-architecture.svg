<svg width="680" height="630" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Weave architecture</title>
<desc>Notion and Todoist feed into a chunk/embed and structured-sync step, landing in pgvector and Postgres storage, merged by a retrieval layer, reasoned over by an LLM agent, and delivered through a chat interface or email and Alexa reminders.</desc>

<rect x="0" y="0" width="680" height="630" fill="#FFFFFF"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Sources -->
<g>
  <rect x="60" y="40" width="150" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="135" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Notion</text>

  <rect x="470" y="40" width="150" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="545" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Todoist</text>
</g>

<!-- Arrows: sources to processing -->
<line x1="135" y1="84" x2="135" y2="140" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="545" y1="84" x2="545" y2="140" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Processing -->
<g>
  <rect x="60" y="140" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="135" y="162" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Chunk + embed</text>
  <text x="135" y="180" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Notion pages</text>

  <rect x="470" y="140" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="545" y="162" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Structured sync</text>
  <text x="545" y="180" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Todoist tasks</text>
</g>

<!-- Arrows: processing to storage -->
<line x1="135" y1="196" x2="135" y2="252" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="545" y1="196" x2="545" y2="252" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Storage -->
<g>
  <rect x="60" y="252" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="135" y="274" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">pgvector</text>
  <text x="135" y="292" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">note embeddings</text>

  <rect x="470" y="252" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="545" y="274" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Postgres</text>
  <text x="545" y="292" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">task rows</text>
</g>

<!-- Arrows: storage to retrieval -->
<line x1="135" y1="308" x2="270" y2="364" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="545" y1="308" x2="410" y2="364" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Retrieval layer -->
<g>
  <rect x="215" y="364" width="250" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="340" y="386" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Retrieval layer</text>
  <text x="340" y="404" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">vector + SQL merge</text>
</g>

<!-- Arrow: retrieval to LLM -->
<line x1="340" y1="420" x2="340" y2="460" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- LLM / agent reasoning -->
<g>
  <rect x="190" y="460" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="340" y="482" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">LLM + agent reasoning</text>
  <text x="340" y="500" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">decides what to surface</text>
</g>

<!-- Arrows: LLM to outputs -->
<line x1="340" y1="516" x2="180" y2="560" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="516" x2="420" y2="560" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Outputs -->
<g>
  <rect x="90" y="560" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="180" y="582" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Chat interface</text>

  <rect x="290" y="560" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="420" y="582" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Reminders: email + Alexa</text>
</g>

</svg>
